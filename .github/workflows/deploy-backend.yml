name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

  workflow_dispatch:

concurrency:
  group: beekeepr-backend-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy backend to EC2
    runs-on: [self-hosted, beekeepr-prod]

    steps:
      - name: Deploy backend
        run: |
          set -euo pipefail

          export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"

          cd /home/ubuntu/beekeepr

          git fetch origin main
          git reset --hard origin/main

          cd backend

          npm install
          npm run db:migrate

          pm2 restart beekeepr-backend --update-env
          pm2 save

          echo "Waiting for backend health check..."

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4000/api/health > /dev/null; then
              echo "Backend is healthy"
              exit 0
            fi

            echo "Backend not ready yet, retrying... ($i/30)"
            sleep 2
          done

          echo "Backend failed health check"
          pm2 status
          pm2 logs beekeepr-backend --lines 100 --nostream
          exit 1
