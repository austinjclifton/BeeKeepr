              schema:
                $ref: "#/components/schemas/Error"

  /api/external-conditions/fetch:
    post:
      tags: [External Conditions]
      summary: Fetch and upsert current external conditions for a hive
      description: Returns the current 10-minute bucket row. If a row for the current bucket already exists, the existing row is returned without calling the upstream provider again.
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/HiveIdQueryRequired"
      responses:
        "200":
          description: External conditions row for the current bucket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalConditionResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Hive not found or hive has no location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

