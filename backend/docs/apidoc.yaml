    get:
      tags: [Alerts]
      summary: List alerts for the authenticated beekeeper
      description: Returns all alerts for the authenticated beekeeper, optionally filtered by `hiveId`.
      security:
        - sessionCookie: []
      parameters:
        - name: hiveId
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Alert list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertListResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/alerts/{alertId}/resolve:
    parameters:
      - name: alertId
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    patch:
      tags: [Alerts]
      summary: Resolve a critical alert
      description: Only alerts with severity `critical` can be resolved. If the alert is already resolved, the existing alert is returned.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Alert resolved or already resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/readings/since:
    get:
      tags: [Readings]
      summary: Return readings for a hive since a timestamp
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/HiveIdQueryRequired"
        - $ref: "#/components/parameters/SinceQueryRequired"
        - $ref: "#/components/parameters/UntilQuery"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/OrderQuery"
      responses:
        "200":
          description: Readings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingListResponse"
              examples:
                example:
                  value:
                    readings:
                      - id: 100
                        device_id: 12
                        bucket_at: "2026-02-28T18:00:00.000Z"
                        received_at: "2026-02-28T18:00:01.000Z"
                        temperature: 91.2
                        rssi: -87
                        created_at: "2026-02-28T18:00:01.000Z"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/readings/latest:
    get:
      tags: [Readings]
      summary: Return the most recent reading for a hive
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/HiveIdQueryRequired"
      responses:
        "200":
          description: Latest reading for the hive. If the hive exists but has no readings yet, the response still contains a `reading` object with `hive_id` set and the reading fields null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LatestReadingResponse"
              examples:
                example:
                  value:
                    reading:
                      hive_id: 7
                      id: 101
                      device_id: 12
                      bucket_at: "2026-02-28T18:10:00.000Z"
                      received_at: "2026-02-28T18:10:01.000Z"
                      temperature: 91.4
                      rssi: -86
                      created_at: "2026-02-28T18:10:01.000Z"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /ingest/readings:
    post:
      tags: [Ingest]
      summary: Accept telemetry payload from a device
      security:
        - ingestTokenHeader: []
        - ingestBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [deviceId, temperature, rssi]
              properties:
                deviceId:
                  type: integer
                  format: int64
                  minimum: 1
                temperature:
                  type: number
                rssi:
                  type: number
      responses:
        "201":
          description: Reading accepted and inserted for the current 10-minute bucket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestReadingResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "409":
          description: A reading already exists for this device in the current 10-minute bucket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestReadingConflictResponse"
