          description: Latest external condition for the hive's location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalConditionResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Hive not found, hive has no location, or no external conditions exist for that hive yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

