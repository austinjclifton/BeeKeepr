          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    post:
      tags: [Locations]
      summary: Create or return an existing location by coordinates
      description: If a location already exists for the given rounded coordinates, the existing record is returned.
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [lat, lon]
              properties:
                name:
                  type: string
                  nullable: true
                  maxLength: 120
                lat:
                  type: number
                lon:
                  type: number
      responses:
        "201":
          description: Location created or existing location returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

